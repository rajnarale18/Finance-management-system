# ================================================
# Finance Backend - Application Configuration
# ================================================

# Server Port
server.port=8080

# ---- Database Configuration ----
# Change username and password to match your MySQL setup
spring.datasource.url=jdbc:mysql://localhost:3306/finance_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate Configuration ----
# "update" means Hibernate will auto-create/update tables based on your entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable open-in-view to prevent lazy DB queries during response serialization
spring.jpa.open-in-view=false

# DO NOT set spring.jpa.database-platform — Hibernate 6 auto-detects MySQL

# ---- App Info ----
spring.application.name=finance-backend
